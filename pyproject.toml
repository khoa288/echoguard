[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echoguard"
version = "0.1.0"
description = "Safety-constrained contextual cascade tools for EchoGuard"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
parquet = ["pyarrow"]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["echoguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
